name: In Public numbers

on:
  schedule:
    - cron: "0 11 * * *"      # once a day, around 6-7am Eastern
  workflow_dispatch:          # "Run workflow" button to update by hand

permissions:
  contents: write

concurrency:
  group: newsroom
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Pull readership from Plausible
        run: python newsroom/readership.py
        env:
          PLAUSIBLE_API_KEY: ${{ secrets.PLAUSIBLE_API_KEY }}
          PLAUSIBLE_SITE: ${{ secrets.PLAUSIBLE_SITE }}

      - name: Save the numbers (this triggers one Netlify rebuild)
        run: |
          git config user.name "dbs-newsroom"
          git config user.email "newsroom@users.noreply.github.com"
          git add newsroom/readership.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "In Public: daily readership update" && git pull --rebase && git push)
