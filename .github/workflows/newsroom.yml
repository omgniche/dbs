name: Newsroom

on:
  schedule:
    - cron: "*/30 * * * *"     # every 30 minutes (GitHub sometimes runs these a little late)
  workflow_dispatch:            # adds a "Run workflow" button so you can trigger it by hand
    inputs:
      url:
        description: "Optional: paste a story link to draft it right now (leave empty for a normal scan)"
        required: false
        default: ""
      text:
        description: "Optional: paste extra text, e.g. the post's words if an X link won't load"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: newsroom
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run the newsroom
        run: python newsroom/run.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MANUAL_URL: ${{ github.event.inputs.url }}
          MANUAL_TEXT: ${{ github.event.inputs.text }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remember what was scanned
        run: |
          git config user.name "dbs-newsroom"
          git config user.email "newsroom@users.noreply.github.com"
          git add newsroom/*.json
          git diff --cached --quiet || (git commit -m "newsroom: update seen list [skip netlify]" && git pull --rebase && git push)
