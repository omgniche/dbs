[build]
  command = "python3 build.py"
  publish = "public"
  # Always build the first time. After that, only rebuild when posts, design,
  # the site editor or readership numbers change, not on every newsroom scan.
  ignore = "[ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ] && exit 1; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- posts static admin build.py netlify.toml newsroom/readership.json"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
